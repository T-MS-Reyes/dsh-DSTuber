<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>dsh-dstuber · Live2D stage</title>
  <style>
    :root {
      color-scheme: dark;
      --card: rgba(16, 22, 32, 0.82);
      --line: rgba(255, 255, 255, 0.14);
      --text: #e8eef7;
      --muted: #93a4bb;
      --accent: #68b5ff;
    }
    html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
    body.bg-grid {
      background-color: #0d1420;
      background-image:
        linear-gradient(45deg, rgba(255,255,255,.045) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.045) 75%),
        linear-gradient(45deg, rgba(255,255,255,.045) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.045) 75%),
        radial-gradient(1200px 800px at 50% 20%, #1c2c44 0%, #0d1420 65%);
      background-size: 32px 32px, 32px 32px, 100% 100%;
      background-position: 0 0, 16px 16px, 0 0;
    }
    body.bg-none { background: transparent; }
    #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #hud {
      position: fixed; top: 16px; left: 16px; z-index: 10;
      min-width: 230px; max-width: min(560px, 86vw);
      padding: 12px 14px; border-radius: 12px;
      background: var(--card); border: 1px solid var(--line);
      color: var(--text); font: 12px/1.55 "Segoe UI", "Microsoft YaHei", sans-serif;
      backdrop-filter: blur(8px); box-shadow: 0 8px 28px rgba(0,0,0,.35);
      user-select: none;
    }
    #hud[hidden] { display: none; }
    #hud h1 { margin: 0 0 6px; font-size: 13px; font-weight: 600; letter-spacing: .02em; }
    #hud h1 span { color: var(--accent); }
    #hud dl { display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; margin: 0; }
    #hud dt { color: var(--muted); }
    #hud dd { margin: 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    #hint {
      position: fixed; left: 16px; bottom: 14px; z-index: 10;
      color: var(--muted); font: 11px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif;
      text-shadow: 0 1px 2px #000; user-select: none;
    }
    #hint[hidden] { display: none; }
    #error {
      position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
      background: rgba(8, 12, 18, .86); color: #ffd7d7;
      font: 13px/1.6 Consolas, "Microsoft YaHei", monospace; padding: 24px; white-space: pre-wrap;
    }
    #error[hidden] { display: none; }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="hud" hidden>
    <h1>DS 鲸鱼娘 · <span>Live2D 测试台</span></h1>
    <dl>
      <dt>状态</dt><dd id="hud-state">loading</dd>
      <dt>表情</dt><dd id="hud-expression">-</dd>
      <dt>动作</dt><dd id="hud-motion">-</dd>
      <dt>口型</dt><dd id="hud-mouth">0.00</dd>
      <dt>帧率</dt><dd id="hud-fps">-</dd>
      <dt>模型</dt><dd id="hud-model">-</dd>
    </dl>
  </div>
  <div id="hint">dsh-dstuber stage · 参数级口型 ParamMouthOpenY · 44 表情 / 8 动作</div>
  <div id="error" hidden></div>

  <script src="vendor/live2dcubismcore.min.js"></script>
  <script src="vendor/pixi.min.js"></script>
  <script src="vendor/cubism4.min.js"></script>
  <script src="performer.js?v=2"></script>
  <script src="stage.js?v=2"></script>
</body>
</html>
