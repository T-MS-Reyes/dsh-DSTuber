[package]
name = "dsh-dstuber-shell"
version = "0.1.0"
description = "Transparent Live2D window for the dsh-dstuber DSH plugin"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-runtime = "=2.12.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
